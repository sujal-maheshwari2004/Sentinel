[project]
name = "sentinel"
version = "0.1.0"
description = "MLOps pipeline sitting between Prometheus and Grafana — pulls metrics, trains models, emits predictions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "joblib>=1.3.0",
    "prometheus-client>=0.20.0",
    "croniter>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]